version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-west-2
    DOCKER_BUILDKIT: "1"
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URL="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - test -n "${IMAGE_TAG}"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URL
      # Pre-pull the previous :latest images so --cache-from can reuse unchanged
      # layers. `|| true` tolerates first-run misses.
      - echo "=== Pre-pulling previous latests for layer cache ==="
      - (docker pull ${ECR_URL}/auto-e2e/training:latest || true) &
      - (docker pull ${ECR_URL}/auto-e2e/data-prep:latest || true) &
      - wait
  build:
    commands:
      # Training, eval and offline-rl share one Dockerfile: build once and tag
      # it three times.
      - echo "=== Building shared training image (training/eval/offline-rl) ==="
      - DOCKER_BUILDKIT=1 docker build
          --cache-from ${ECR_URL}/auto-e2e/training:latest
          --build-arg BUILDKIT_INLINE_CACHE=1
          -t ${ECR_URL}/auto-e2e/training:${IMAGE_TAG}
          -t ${ECR_URL}/auto-e2e/eval:${IMAGE_TAG}
          -t ${ECR_URL}/auto-e2e/offline-rl:${IMAGE_TAG}
          -f Platform/docker/training/Dockerfile .

      # Data-prep has its own Dockerfile (~5GB). Every image is built before
      # any push starts so a push cannot race an unfinished build.
      - echo "=== Building data-prep image ==="
      - DOCKER_BUILDKIT=1 docker build
          --cache-from ${ECR_URL}/auto-e2e/data-prep:latest
          --build-arg BUILDKIT_INLINE_CACHE=1
          -t ${ECR_URL}/auto-e2e/data-prep:${IMAGE_TAG}
          -f Platform/docker/data-prep/Dockerfile .

      # Import the libraries every task needs before anything is pushed: an
      # unpinned upgrade once made pyarrow reject the image's NumPy, which only
      # surfaced as task failures in production.
      - echo "=== Import checks ==="
      - docker run --rm ${ECR_URL}/auto-e2e/data-prep:${IMAGE_TAG} python -c "import numpy, pyarrow, pyarrow.parquet, kitscenes, flytekit, boto3; print('data-prep imports ok', numpy.__version__, pyarrow.__version__)"
      - docker run --rm ${ECR_URL}/auto-e2e/training:${IMAGE_TAG} python -c "import numpy, torch, ray, mlflow, flytekit, flytekitplugins.ray; from mlflow.entities import LoggedModelInput; print('training imports ok', mlflow.__version__)"

      # Push in parallel. ECR dedups blobs, so the three training-image tags
      # upload the layers once.
      - echo "=== Pushing all images in parallel ==="
      - |
        docker push ${ECR_URL}/auto-e2e/training:${IMAGE_TAG} &
        PID_T=$!
        docker push ${ECR_URL}/auto-e2e/eval:${IMAGE_TAG} &
        PID_E=$!
        docker push ${ECR_URL}/auto-e2e/offline-rl:${IMAGE_TAG} &
        PID_O=$!
        docker push ${ECR_URL}/auto-e2e/data-prep:${IMAGE_TAG} &
        PID_D=$!
        # Wait on each PID explicitly so any push failure fails the build.
        wait $PID_T && echo "training pushed" || exit 1
        wait $PID_E && echo "eval pushed" || exit 1
        wait $PID_O && echo "offline-rl pushed" || exit 1
        wait $PID_D && echo "data-prep pushed" || exit 1

cache:
  paths:
    - '/root/.cache/pip/**/*'
